%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/siliconmitus,sm5714-fuelgauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5714 fuel gauge

maintainers:
  - Omar Fityan <me@omarfityan.com>

description:
  The fuel-gauge sub-block of the Silicon Mitus SM5714 power-management IC,
  accessed as an independent I2C client at its own address. It reports battery
  capacity, voltage, current and temperature as a POWER_SUPPLY_TYPE_BATTERY.
  The gauge is cell-powered and keeps its vendor-programmed model across
  resets, so no model data is passed through the device tree.

properties:
  compatible:
    const: siliconmitus,sm5714-fuelgauge

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        fuel-gauge@71 {
            compatible = "siliconmitus,sm5714-fuelgauge";
            reg = <0x71>;
        };
    };
...
